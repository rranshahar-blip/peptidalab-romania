<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="252mm" height="54mm" viewBox="0 0 952 204" role="img" aria-labelledby="title desc">
  <title id="title">PeptidaLab EU — logo principal</title>
  <desc id="desc">Logo molecular premium în indigo, violet și albastru glaciar.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7564E8"/><stop offset="1" stop-color="#73D7F7"/></linearGradient>
    <style>
      .indigo{fill:#152A63}.accent{fill:url(#accent)}.line{fill:none;stroke:#152A63;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .brand{font-family:'Nimbus Sans','DejaVu Sans',sans-serif;font-size:74px;font-weight:700;letter-spacing:4px}
      .country{font-family:'Nimbus Sans','DejaVu Sans',sans-serif;font-size:21px;font-weight:700;letter-spacing:8px}
      .tag{font-family:'Nimbus Sans','DejaVu Sans',sans-serif;font-size:17px;font-weight:400;letter-spacing:1.8px}
    </style>
  </defs>
  <g transform="translate(20,21)">
    <path class="line" d="M22 121 L22 35 L61 16 L99 38 L99 76 L61 98 L22 76 M61 98 L99 121"/>
    <circle class="indigo" cx="22" cy="35" r="9"/><circle class="indigo" cx="61" cy="16" r="9"/><circle class="indigo" cx="99" cy="38" r="9"/><circle class="indigo" cx="99" cy="76" r="9"/><circle class="indigo" cx="61" cy="98" r="9"/><circle class="accent" cx="22" cy="121" r="11"/><circle class="indigo" cx="99" cy="121" r="9"/>
  </g>
  <text x="154" y="94" class="brand indigo">PEPTIDA<tspan class="accent">LAB</tspan></text>
  <text x="159" y="130" class="country indigo">EU</text>
  <line x1="159" y1="151" x2="858" y2="151" stroke="#CCD8EC" stroke-width="2"/>
  <circle cx="159" cy="151" r="5" class="accent"/>
  <text x="159" y="181" class="tag indigo">CLARITATE MOLECULARĂ. STANDARDE MĂSURABILE.</text>
